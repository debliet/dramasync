<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DramaSync — Início</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="mobile">
        <div class="screen">

            <header class="app-header">
                <h1 class="app-logo">DramaSync</h1>

                <a
                    class="notification-button"
                    href="notifications.html"
                    aria-label="Notificações"
                >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
                        <path d="M10 21h4"/>
                    </svg>
                </a>
            </header>

            <main class="page-content home-page">
                <form class="search-bar" role="search">
                    <label class="sr-only" for="series-search">
                        Buscar nas séries que você está assistindo
                    </label>

                    <input
                        id="series-search"
                        name="search"
                        type="search"
                        placeholder="Busque as séries que você está assistindo"
                    >

                    <button type="submit" aria-label="Buscar">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="10" cy="10" r="6"/>
                            <path d="m15 15 6 6"/>
                        </svg>
                    </button>
                </form>

                <section class="empty-state" aria-labelledby="empty-title">
                    <svg
                        class="empty-illustration"
                        viewBox="0 0 120 100"
                        aria-hidden="true"
                    >
                        <rect x="15" y="12" width="90" height="65" rx="8"/>
                        <path d="M45 90h30M60 77v13"/>
                        <circle cx="45" cy="38" r="2"/>
                        <circle cx="75" cy="38" r="2"/>
                        <path d="M47 57q13-16 26 0"/>
                    </svg>

                    <h2 id="empty-title">Nenhuma série</h2>
                    <p>Adicione suas séries para vê-las aqui</p>
                </section>
            </main>

            <nav class="bottom-nav" aria-label="Navegação principal">
                <a class="nav-item" href="index.html" aria-current="page">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="m3 10 9-7 9 7M5 9v12h14V9"/>
                        <path d="M9 21v-8h6v8"/>
                    </svg>
                    <span>Início</span>
                </a>

                <a class="nav-item" href="library.html">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="3" y="5" width="13" height="14" rx="2"/>
                        <path d="m16 10 5-3v10l-5-3"/>
                    </svg>
                    <span>Minhas séries</span>
                </a>

                <a class="nav-item" href="friends.html">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="7" r="3"/>
                        <path d="M6 21v-3a6 6 0 0 1 12 0v3"/>
                        <path d="M5 5a3 3 0 0 0 0 6M19 5a3 3 0 0 1 0 6"/>
                        <path d="M2 20v-2a5 5 0 0 1 3-4M22 20v-2a5 5 0 0 0-3-4"/>
                    </svg>
                    <span>Amigos</span>
                </a>

                <a class="nav-item" href="profile.html">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="7" r="4"/>
                        <path d="M4 21v-2a8 8 0 0 1 16 0v2Z"/>
                    </svg>
                    <span>Perfil</span>
                </a>
            </nav>

        </div>
    </div>
</body>
</html>
