<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DramaSync — Amigos</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="js/friends.js" defer></script>
</head>

<body>
    <div class="mobile">
        <div class="screen">

            <header class="app-header">
                <h1 class="app-logo">DramaSync</h1>

                <a
                    class="notification-button"
                    href="notifications.html"
                    aria-label="Notificações"
                    >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
                        <path d="M10 21h4"/>
                    </svg>
                </a>
            </header>

            <main class="page-content friends-page">
                <div class="friends-tabs" role="tablist" aria-label="Amigos">
                    <button
                        class="friends-tab"
                        id="my-friends-tab"
                        type="button"
                        role="tab"
                        aria-selected="true"
                        aria-controls="my-friends-panel"
                    >
                        Meus amigos
                    </button>

                    <button
                        class="friends-tab"
                        id="requests-tab"
                        type="button"
                        role="tab"
                        aria-selected="false"
                        aria-controls="requests-panel"
                        tabindex="-1"
                    >
                        Pedidos de amizade
                    </button>

                    <button
                        class="friends-tab"
                        id="find-friends-tab"
                        type="button"
                        role="tab"
                        aria-selected="false"
                        aria-controls="find-friends-panel"
                        tabindex="-1"
                    >
                        Busca
                    </button>
                </div>

                <section
                    id="my-friends-panel"
                    role="tabpanel"
                    aria-labelledby="my-friends-tab"
                >
                    <ul class="friends-list">
                        <li class="friend-item">
                            <div class="friend-avatar" aria-hidden="true">C</div>
                            <span class="friend-name">Cake</span>
                        </li>

                        <li class="friend-item">
                            <div class="friend-avatar" aria-hidden="true">G</div>
                            <span class="friend-name">Gamora</span>
                        </li>

                        <li class="friend-item">
                            <div class="friend-avatar" aria-hidden="true">T</div>
                            <span class="friend-name">Tauriel</span>
                        </li>
                    </ul>
                </section>

                <section
                    id="requests-panel"
                    role="tabpanel"
                    aria-labelledby="requests-tab"
                    hidden
                >
                    <p class="friends-message">Nenhum pedido de amizade por enquanto.</p>
                </section>

                <section
                    id="find-friends-panel"
                    role="tabpanel"
                    aria-labelledby="find-friends-tab"
                    hidden
                >
                    <label class="friend-search-label" for="friend-search">
                        Buscar pessoas
                    </label>

                    <input
                        class="friend-search-input"
                        id="friend-search"
                        type="search"
                        placeholder="Digite um nome de usuário"
                    >

                </section>
            </main>

            <nav class="bottom-nav" aria-label="Navegação principal">
                <a class="nav-item" href="index.html">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="m3 10 9-7 9 7M5 9v12h14V9"/>
                        <path d="M9 21v-8h6v8"/>
                    </svg>
                    <span>Início</span>
                </a>

                <a class="nav-item" href="library.html">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="3" y="5" width="13" height="14" rx="2"/>
                        <path d="m16 10 5-3v10l-5-3"/>
                    </svg>
                    <span>Minhas séries</span>
                </a>

                <a class="nav-item" href="friends.html" aria-current="page">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="7" r="3"/>
                        <path d="M6 21v-3a6 6 0 0 1 12 0v3"/>
                        <path d="M5 5a3 3 0 0 0 0 6M19 5a3 3 0 0 1 0 6"/>
                        <path d="M2 20v-2a5 5 0 0 1 3-4M22 20v-2a5 5 0 0 0-3-4"/>
                    </svg>
                    <span>Amigos</span>
                </a>

                <a class="nav-item" href="profile.html">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="7" r="4"/>
                        <path d="M4 21v-2a8 8 0 0 1 16 0v2Z"/>
                    </svg>
                    <span>Perfil</span>
                </a>
            </nav>

        </div>
    </div>
</body>
</html>
